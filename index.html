<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>

    
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />

    
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="container">
      

      <aside class="sidebar">
        <div class="logo">
          <i class="fa-brands fa-spotify"></i>
          <h2>Spotify</h2>
        </div>

        <nav>
          <a href="#" id="homeBtn" class="active">
            <i class="fa-solid fa-house"></i>
            Home
          </a>

          <a href="#" id="discoverBtn">
            <i class="fa-solid fa-compass"></i>
            Discover
          </a>

          <a href="#" id="likedBtn">
            <i class="fa-solid fa-heart"></i>
            Liked Songs
          </a>

          <a href="#" id="playlistBtn">
            <i class="fa-solid fa-music"></i>
            Playlists
          </a>

          <a href="#" id="recentBtn">
            <i class="fa-solid fa-clock-rotate-left"></i>
            Recently Played
          </a>
        </nav>
      </aside>

      

      <main class="main">
        

        <header>
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>

            <input
              type="text"
              id="searchInput"
              placeholder="Search Songs, Albums, Artists"
            />
          </div>

          <div class="header-right">
            <button id="themeBtn">
              <i class="fa-solid fa-moon"></i>
            </button>

            <img src="images/user.png" alt="User" />
          </div>
        </header>

        

        <section class="hero">
          <div>
            <h1>Feel The Music.</h1>

            <p>Millions of songs from artists around the world.</p>

            <button class="hero-btn">Explore Now</button>
          </div>
        </section>

        

        <section class="section">
          <div class="section-title">
            <h2>Trending Songs</h2>

            <a href="#">View All</a>
          </div>

          <div class="card-container" id="trendingSongs"></div>
        </section>

        

        <section class="section">
          <div class="section-title">
            <h2>Popular Artists</h2>

            <a href="#">View All</a>
          </div>

          <div class="artist-container" id="artistContainer"></div>
        </section>

        

        <section class="section">
          <div class="section-title">
            <h2>Recently Played</h2>
          </div>

          <div class="recent-container" id="recentSongs"></div>
        </section>
      </main>
    </div>

    

    <footer class="player">
      

      <div class="song-info">
        <img id="coverImage" src="images/default-cover.png" alt="" />

        <div>
          <h4 id="songTitle">Select Song</h4>

          <p id="artistName">Artist</p>
        </div>
      </div>

      

      <div class="controls">
        <div class="control-buttons">
          <button id="shuffleBtn">
            <i class="fa-solid fa-shuffle"></i>
          </button>

          <button id="prevBtn">
            <i class="fa-solid fa-backward-step"></i>
          </button>

          <button id="playBtn">
            <i class="fa-solid fa-play"></i>
          </button>

          <button id="nextBtn">
            <i class="fa-solid fa-forward-step"></i>
          </button>

          <button id="repeatBtn">
            <i class="fa-solid fa-repeat"></i>
          </button>
        </div>

        <div class="progress-area">
          <span id="currentTime">0:00</span>

          <input type="range" id="progressBar" value="0" />

          <span id="duration">0:00</span>
        </div>
      </div>

      

      <div class="extra-controls">
        <button id="queueBtn">
          <i class="fa-solid fa-list"></i>
        </button>

        <i class="fa-solid fa-volume-high"></i>

        <input type="range" id="volumeBar" min="0" max="100" value="100" />
      </div>
    </footer>

    

    <audio id="audioPlayer"></audio>

    

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/playlist.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
